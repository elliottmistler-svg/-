<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⭐ أداة تجميع النقاط</title>
    <!-- Bootstrap 5 + Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        /* ===== خلفية متحركة مع شعارات ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: #0a0e14;
            color: #eef2f6;
            padding: 1.5rem 0 4rem;
            position: relative;
            overflow-x: hidden;
        }
        /* خلفية الشعارات المتحركة */
        .background-logos {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.15;
        }
        .background-logos .logo {
            position: absolute;
            font-size: 4rem;
            animation: floatLogo 25s infinite linear;
            color: #3b82f6;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }
        .background-logos .logo:nth-child(1) {
            top: 5%;
            left: 5%;
            animation-duration: 28s;
            font-size: 5rem;
            color: #8b5cf6;
        }
        .background-logos .logo:nth-child(2) {
            top: 15%;
            right: 10%;
            animation-duration: 32s;
            animation-delay: 3s;
            color: #22c55e;
        }
        .background-logos .logo:nth-child(3) {
            bottom: 20%;
            left: 8%;
            animation-duration: 26s;
            animation-delay: 6s;
            color: #facc15;
        }
        .background-logos .logo:nth-child(4) {
            bottom: 10%;
            right: 5%;
            animation-duration: 30s;
            animation-delay: 4s;
            color: #ef4444;
        }
        .background-logos .logo:nth-child(5) {
            top: 40%;
            left: 50%;
            animation-duration: 34s;
            animation-delay: 2s;
            color: #60a5fa;
            font-size: 6rem;
        }
        .background-logos .logo:nth-child(6) {
            top: 60%;
            right: 15%;
            animation-duration: 29s;
            animation-delay: 8s;
            color: #f472b6;
        }
        @keyframes floatLogo {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            25% {
                transform: translate(50px, -80px) rotate(90deg) scale(1.2);
            }
            50% {
                transform: translate(-30px, 60px) rotate(180deg) scale(0.9);
            }
            75% {
                transform: translate(40px, -40px) rotate(270deg) scale(1.1);
            }
            100% {
                transform: translate(0, 0) rotate(360deg) scale(1);
            }
        }

        /* ===== المحتوى فوق الخلفية ===== */
        .container {
            position: relative;
            z-index: 1;
        }
        .glass-card {
            background: rgba(18, 26, 36, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
            transition: transform 0.25s ease, box-shadow 0.3s;
        }
        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 28px 56px rgba(0, 0, 0, 0.8);
        }
        .btn-glow {
            border-radius: 60px;
            padding: 0.65rem 2.2rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            transition: all 0.2s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-glow:hover::after {
            opacity: 1;
        }
        .btn-primary-glow {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
        }
        .btn-primary-glow:hover {
            box-shadow: 0 0 28px #3b82f688;
            color: #fff;
        }
        .btn-success-glow {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
        }
        .btn-success-glow:hover {
            box-shadow: 0 0 28px #22c55e88;
            color: #fff;
        }
        .btn-danger-glow {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }
        .btn-danger-glow:hover {
            box-shadow: 0 0 28px #ef444488;
            color: #fff;
        }
        .btn-outline-glow {
            background: transparent;
            border: 1.5px solid #4b5a6e;
            color: #d1d9e6;
        }
        .btn-outline-glow:hover {
            background: #1f2a36;
            border-color: #8b9bb0;
            color: #fff;
        }
        .stat-box {
            background: #131d28;
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            border-right: 5px solid #3b82f6;
            margin-bottom: 0.7rem;
            transition: background 0.2s;
        }
        .stat-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #9aaec3;
        }
        .stat-box .value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.3;
        }
        .stat-box.good {
            border-right-color: #22c55e;
        }
        .stat-box.bad {
            border-right-color: #ef4444;
        }
        .stat-box.score {
            border-right-color: #facc15;
        }
        .stat-box.score .value {
            color: #facc15;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #3b82f6;
            object-fit: cover;
            background: #1f2a36;
        }
        .badge-score {
            background: #facc15;
            color: #0a0e14;
            font-weight: 700;
            padding: 0.4rem 1.4rem;
            border-radius: 60px;
            font-size: 0.9rem;
        }
        .farming-indicator {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-left: 12px;
            transition: all 0.3s;
        }
        .farming-indicator.active {
            background: #22c55e;
            box-shadow: 0 0 20px #22c55e;
            animation: pulse 1.4s infinite;
        }
        .farming-indicator.inactive {
            background: #6b7a8e;
        }
        @keyframes pulse {
            0% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 0.5;
                transform: scale(0.9);
            }
        }
        .action-grid .btn {
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 24px;
            background: #141e2a;
            border: 1px solid #2a3848;
            color: #eef2f6;
            transition: all 0.2s;
            font-weight: 500;
        }
        .action-grid .btn:hover {
            background: #1d2a3a;
            border-color: #3b82f6;
            transform: scale(1.03);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
        }
        .action-grid .btn i {
            font-size: 2.2rem;
        }
        .toast-container {
            z-index: 9999;
        }
        .toast {
            background: #1a2633;
            border: 1px solid #2f4052;
            color: #f0f4f8;
            backdrop-filter: blur(6px);
        }
        .toast-header {
            background: transparent;
            border-bottom: 1px solid #2f4052;
            color: #f0f4f8;
        }
        .modal-content {
            background: #1a2633;
            color: #eef2f6;
            border: 1px solid #2f4052;
            border-radius: 24px;
        }
        .modal-header {
            border-bottom: 1px solid #2f4052;
        }
        .form-control {
            background: #0f1823;
            border: 1px solid #2f4052;
            color: #f0f4f8;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
        }
        .form-control:focus {
            background: #0f1823;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px #3b82f644;
            color: #fff;
        }
        .form-control::placeholder {
            color: #6a7f96;
        }
        .log-area {
            background: #0d1620;
            border-radius: 18px;
            padding: 1rem 1.4rem;
            max-height: 160px;
            overflow-y: auto;
            font-size: 0.85rem;
            font-family: 'Consolas', monospace;
            color: #b0c8dd;
            border: 1px solid #1f2d3b;
            margin-top: 0.8rem;
            direction: ltr;
            text-align: left;
        }
        .log-area .log-entry {
            padding: 0.2rem 0;
            border-bottom: 1px solid #1a2633;
        }
        .log-area .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry .time {
            color: #6a7f96;
            margin-right: 10px;
        }
        .log-entry .good {
            color: #22c55e;
        }
        .log-entry .bad {
            color: #ef4444;
        }
        .log-entry .info {
            color: #60a5fa;
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loginCard {
            max-width: 550px;
            margin: 2rem auto;
        }
        .logout-btn {
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            transition: all 0.3s;
            background: transparent;
            border: 1px solid #4b5a6e;
            color: #d1d9e6;
        }
        .logout-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: #fff;
        }
        .amount-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid #2a3848;
            background: #0f1823;
            color: #eef2f6;
            transition: all 0.2s;
            cursor: pointer;
            font-weight: 600;
        }
        .amount-btn:hover,
        .amount-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }
        .amount-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .amount-group .amount-btn {
            flex: 1;
            min-width: 60px;
        }
    </style>
</head>
<body>

    <!-- ====== خلفية الشعارات المتحركة ====== -->
    <div class="background-logos">
        <div class="logo"><i class="bi bi-star-fill"></i></div>
        <div class="logo"><i class="bi bi-lightning-fill"></i></div>
        <div class="logo"><i class="bi bi-gem"></i></div>
        <div class="logo"><i class="bi bi-trophy-fill"></i></div>
        <div class="logo"><i class="bi bi-coin"></i></div>
        <div class="logo"><i class="bi bi-rocket-takeoff-fill"></i></div>
    </div>

    <div class="container py-3">

        <!-- ====== رأس الصفحة ====== -->
        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
            <h1 class="h3 fw-bold text-glow"><i class="bi bi-lightning-charge-fill text-warning me-2"></i>Spark Tool</h1>
            <div id="userInfo" class="d-flex align-items-center gap-3">
                <span class="badge-score" id="userScore">0</span>
                <span id="userName" class="fw-semibold text-light">زائر</span>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=U&background=3b82f6&color=fff&size=40" alt="avatar" class="user-avatar" />
                <button class="logout-btn" onclick="logout()" title="تسجيل الخروج"><i class="bi bi-box-arrow-left"></i></button>
            </div>
        </div>

        <!-- ====== بطاقة تسجيل الدخول ====== -->
        <div id="loginCard" class="glass-card">
            <h4 class="text-center mb-3"><i class="bi bi-person-circle me-2"></i>تسجيل الدخول</h4>
            <div class="mb-3">
                <label class="form-label fw-semibold"><i class="bi bi-person-fill me-1"></i>اسم المستخدم</label>
                <input type="text" id="loginUser" class="form-control" placeholder="أدخل اسم المستخدم" />
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold"><i class="bi bi-key-fill me-1"></i>كلمة المرور</label>
                <input type="password" id="loginPass" class="form-control" placeholder="أدخل كلمة المرور" />
            </div>
            <div class="d-grid">
                <button id="loginBtn" class="btn btn-primary-glow btn-glow" onclick="handleLogin()">
                    <i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول
                </button>
            </div>
            <div id="loginStatus" class="mt-3 small text-info text-center"></div>
        </div>

        <!-- ====== لوحة التحكم ====== -->
        <div id="dashboard" style="display: none;">

            <!-- صف الإحصائيات -->
            <div class="row g-3 mb-4">
                <div class="col-md-3 col-6">
                    <div class="stat-box score">
                        <div class="label"><i class="bi bi-star-fill me-1"></i>النقاط المجمعة</div>
                        <div class="value" id="statScore">0</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-box">
                        <div class="label"><i class="bi bi-check-circle-fill me-1"></i>المهام الكلية</div>
                        <div class="value" id="statTotal">0</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-box good">
                        <div class="label"><i class="bi bi-check2-circle me-1"></i>ناجحة</div>
                        <div class="value text-success" id="statGood">0</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-box bad">
                        <div class="label"><i class="bi bi-x-circle me-1"></i>فاشلة</div>
                        <div class="value text-danger" id="statBad">0</div>
                    </div>
                </div>
            </div>

            <!-- زر التجميع + سجل الأحداث -->
            <div class="glass-card mb-4">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <div>
                        <h5 class="fw-bold mb-1"><i class="bi bi-robot me-2"></i>تجميع النقاط</h5>
                        <span class="text-muted small">يعمل في الخلفية بشكل مستمر</span>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <span id="farmingStatusText" class="text-muted small">متوقف</span>
                        <span id="farmingIndicator" class="farming-indicator inactive"></span>
                        <button id="farmingToggleBtn" class="btn btn-success-glow btn-glow" onclick="toggleFarming()">
                            <i class="bi bi-play-fill me-1"></i>ابدأ التجميع
                        </button>
                    </div>
                </div>
                <div class="log-area" id="logArea">
                    <div class="log-entry text-muted">📋 انتظر بدء التجميع لعرض الأحداث ...</div>
                </div>
            </div>

            <!-- أزرار الرشق -->
            <h5 class="fw-bold mt-4 mb-3"><i class="bi bi-send-fill me-2 text-primary"></i>خدمات الرشق</h5>
            <div class="row g-3 action-grid">
                <div class="col-6 col-md-3">
                    <button class="btn w-100" onclick="openOrderModal('followers', 'يوزر التيك توك')">
                        <i class="bi bi-people-fill text-info"></i>
                        <span>متابعين</span>
                    </button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="btn w-100" onclick="openOrderModal('likes', 'رابط الفيديو')">
                        <i class="bi bi-heart-fill text-danger"></i>
                        <span>لايكات</span>
                    </button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="btn w-100" onclick="openOrderModal('views', 'رابط الفيديو')">
                        <i class="bi bi-eye-fill text-warning"></i>
                        <span>مشاهدات</span>
                    </button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="btn w-100" onclick="openOrderModal('comments', 'رابط الفيديو')">
                        <i class="bi bi-chat-dots-fill text-success"></i>
                        <span>تعليقات</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== مودال الرشق ====== -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orderModalLabel">إرسال طلب رشق</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" id="orderTargetLabel">الهدف</label>
                        <input type="text" id="orderTarget" class="form-control" placeholder="أدخل الهدف..." />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الكمية</label>
                        <div class="amount-group" id="amountGroup">
                            <button class="amount-btn" data-amount="100" onclick="selectAmount(100)">100</button>
                            <button class="amount-btn active" data-amount="500" onclick="selectAmount(500)">500</button>
                            <button class="amount-btn" data-amount="1000" onclick="selectAmount(1000)">1K</button>
                            <button class="amount-btn" data-amount="5000" onclick="selectAmount(5000)">5K</button>
                            <button class="amount-btn" data-amount="10000" onclick="selectAmount(10000)">10K</button>
                        </div>
                        <input type="number" id="orderAmount" class="form-control mt-2" placeholder="أو أدخل كمية مخصصة" min="1" value="500" />
                    </div>
                    <div id="orderStatus" class="small text-info"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-glow btn-glow" data-bs-dismiss="modal">إلغاء</button>
                    <button id="orderSubmitBtn" class="btn btn-primary-glow btn-glow" onclick="submitOrder()">
                        <i class="bi bi-send me-1"></i>إرسال
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== Toast ====== -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">إشعار</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody">نص الإشعار</div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        // =================================================================
        //  الإعدادات الثابتة (نفس الكود الأصلي)
        // =================================================================
        const DEV_INFO =
            '{"d":"61393235613366373261636533656632","n":"494e46494e495820496e66696e6978204c697465203330","o":"16","t":"d","v":"2.2.9","s":"0,0"}';
        const KEY_BYTES = [0x35, 0x30, 0x1c, 0x2f, 0x2c, 0x2c, 0x28, 0x31, 0x35, 0x30, 0x1c, 0x2f, 0x2c, 0x2c, 0x28, 0x31];
        const SECRET_KEY = new Uint8Array(KEY_BYTES.map(b => b ^ 0x43));

        function getSecretBuffer() { return SECRET_KEY.buffer; }

        // =================================================================
        //  دوال التشفير
        // =================================================================
        async function hmacSha256(keyBuffer, message) {
            const encoder = new TextEncoder();
            const msgBuffer = encoder.encode(message);
            const cryptoKey = await crypto.subtle.importKey(
                'raw', keyBuffer, { name: 'HMAC', hash: 'SHA-256' },
                false, ['sign']
            );
            const sigBuffer = await crypto.subtle.sign('HMAC', cryptoKey, msgBuffer);
            const hashArray = Array.from(new Uint8Array(sigBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // =================================================================
        //  إدارة الجلسة
        // =================================================================
        function saveSession(token, csrf, user) {
            localStorage.setItem('spark_token', token);
            localStorage.setItem('spark_csrf', csrf);
            localStorage.setItem('spark_user', JSON.stringify(user));
        }

        function loadSession() {
            const token = localStorage.getItem('spark_token');
            const csrf = localStorage.getItem('spark_csrf');
            const userStr = localStorage.getItem('spark_user');
            if (token && csrf && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    return { token, csrf, user };
                } catch (_) { return null; }
            }
            return null;
        }

        function clearSession() {
            localStorage.removeItem('spark_token');
            localStorage.removeItem('spark_csrf');
            localStorage.removeItem('spark_user');
        }

        // =================================================================
        //  متغيرات الجلسة
        // =================================================================
        let userToken = "";
        let csrfToken = "1786692648457:b5fb61a1a92b2de8ffa0343c5d45ce9f1e578abb695cca7ab6659cfc29f85fe9";
        let currentUserScore = 0;
        let currentUserData = null;

        // =================================================================
        //  دوال API
        // =================================================================
        const OPERATION_IDS = {

        async function sendRequest(payload, opName, needsAuth = true) {
            const payloadStr = JSON.stringify(payload);
            const ts = Date.now().toString();
            const nonce = crypto.randomUUID().slice(0, 16);
            const sig = await hmacSha256(getSecretBuffer(), `${ts}-${nonce}-${payloadStr}`);

            const headers = {
                'X-APOLLO-OPERATION-NAME': opName,
                'Accept': 'multipart/mixed; deferSpec=20220824, application/json',
                'x-language': 'ar',
                'x-app-name': 'com.dev.vidspark',
                'x-device-info': DEV_INFO,
                'x-app-sig': sig,
                'x-app-ts': ts,
                'x-app-nonce': nonce,
                'Content-Type': 'application/json',
                'User-Agent': 'okhttp/4.12.0'
            };

            if (OPERATION_IDS[opName]) {
                headers['X-APOLLO-OPERATION-ID'] = OPERATION_IDS[opName];
            }
            if (needsAuth) {
                headers['token'] = userToken;
                headers['x-csrf-token'] = csrfToken;
            }

            const resp = await fetch('https://api.tikspark.xyz/graphql', {
                method: 'POST',
                headers: headers,
                body: payloadStr
            });

            const text = await resp.text();
            let json = null;
            try { json = JSON.parse(text); } catch (_) { json = { error: 'Invalid JSON', raw: text }; }

            const newCsrf = resp.headers.get('x-csrf-token');
            if (newCsrf) csrfToken = newCsrf;

            return { response: resp, json };
        }

        async function login(username, password) {
            const payload = {
                operationName: "LoginAccount",
                variables: {
                    data: {
                        id: "",
                        uniqueId: username,
                        nickname: "",
                        avatarMedium: "https://p16-common-sign.tiktokcdn.com/musically-maliva-obj/1594805258216454~tplv-tiktokx-cropcenter:720:720.webp",
                        followerCount: 0,
                        followingCount: 0,
                        videoCount: 0,
                        privateAccount: false,
                        diggCount: 0,
                        authMethod: "local",
                        password: password
                    }
                },
                query: `mutation LoginAccount($data: TiktokInfo) { loginTiktok(data: $data) { accessToken refreshToken user { __typename ...UserFields } } } 
                            fragment UserFields on User { _id tiktokId nickname email score diggCount followerCount followingCount friendCount isMembershipExpired heartCount username avatar banned vip vipExpiresAt authMethod isSubscription allowd referralCode referralCount referredBy }`
            };
            const { response, json } = await sendRequest(payload, "LoginAccount", false);
            if (response.ok && json && !json.errors) {
                userToken = json.data.loginTiktok.accessToken;
                const user = json.data.loginTiktok.user;
                currentUserScore = user.score || 0;
                currentUserData = user;
                saveSession(userToken, csrfToken, user);
                return { success: true, user: user };
            }
            const err = json?.errors?.[0]?.message || 'فشل تسجيل الدخول';
            return { success: false, error: err };
        }

        async function actionOrder(orderId) {
            const rand = Math.floor(Math.random() * 1500) + 3000;
            const payload = {
                operationName: "ActionOrder",
                variables: {
                    orderId: orderId,
                    validationData: {
                        attempts: 1,

                        source: "CLIENT_CRONET"
                    }
                },
                query: `mutation ActionOrder($orderId: ID!, $validationData: ValidationDataInput!) { actionOrder(orderId: $orderId, validationData: $validationData) { score taskProgress { count startTime taskProgressLimit } } }`
            };
            const { json } = await sendRequest(payload, "ActionOrder", true);
            if (json && !json.errors) {
                const score = json.data?.actionOrder?.score || 0;
                currentUserScore += parseInt(score);
                return { success: true, score: parseInt(score) };

            return { success: false };

        async function createOrder(type, amount, target) {
            const vars = {
                type: type,
                amount: amount,
                avatar: "https://p16-common-sign.tiktokcdn.com/musically-maliva-obj/1594805258216454~tplv-tiktokx-cropcenter:720:720.webp",
                initialCount: Math.floor(Math.random() * 10000)
            };
            if (type === 'followers') {
                vars.tiktokerUsername = target;
            } else {
                vars.videoLink = target;
            }

            const payload = {
                operationName: "CreateOrder",
                variables: vars,
                query: `mutation CreateOrder($type: Action!, $amount: Int!, $tiktokerUsername: String, $videoLink: String, $avatar: String, $initialCount: Int) { createOrder(orderInput: { type: $type amount: $amount tiktokerUsername: $tiktokerUsername videoLink: $videoLink avatar: $avatar initialCount: $initialCount } ) { _id type videoLink tiktokerUsername avatar score priority amount initialCount fulfilled isPublished status createdAt } }`
            };
            const { json } = await sendRequest(payload, "CreateOrder", true);
            if (json && !json.errors) {
                return { success: true, data: json.data.createOrder };
            }
            const err = json?.errors?.[0]?.message || 'فشل إنشاء الطلب';
            return { success: false, error: err };
        }

        // =================================================================

        let farmingActive = false;

        const logArea = document.getElementById('logArea');

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${message}</span>`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
            while (logArea.children.length > 50) {
                logArea.removeChild(logArea.firstChild);
            }
        }

        function updateStatsUI() {
            document.getElementById('statTotal').textContent = stats.total;
            document.getElementById('statGood').textContent = stats.good;
            document.getElementById('statBad').textContent = stats.bad;
            document.getElementById('statScore').textContent = stats.score;
            document.getElementById('userScore').textContent = currentUserScore;
        }

        // الحلقة الرئيسية للتجميع
        async function farmingLoop() {
            if (!farmingActive) return;

            try {
                const orders = await getOrders();
                const pending = orders.filter(o => o.status === 'pending').map(o => o._id);

                if (pending.length === 0) {
                    addLog('📭 لا توجد مهام معلقة، ننتظر 10 ثوانٍ ...', 'info');
                    farmingLoopTimeout = setTimeout(farmingLoop, 10000);
                    return;
                }

                addLog(`🔍 تم العثور على ${pending.length} مهمة معلقة`, 'info');
                for (const id of pending) {
                    if (!farmingActive) break;
                    const result = await actionOrder(id);
                    stats.total++;
                    if (result.success) {
                        const points = result.score;
                        stats.good++;
                        stats.score += points;
                        addLog(`✅ تم جمع ${points} نقطة (المهمة ${id})`, 'good');
                        currentUserScore += points;
                    } else {
                        stats.bad++;
                        addLog(`❌ فشلت المهمة ${id}`, 'bad');
                    }
                    updateStatsUI();
                    await new Promise(r => setTimeout(r, Math.random() * 1500 + 1500));
                }

                if (farmingActive) {
                    farmingLoopTimeout = setTimeout(farmingLoop, 3000);
                }

            } catch (e) {
                addLog(`⚠️ خطأ: ${e.message}`, 'bad');
                if (farmingActive) {
                    farmingLoopTimeout = setTimeout(farmingLoop, 10000);
                }
            }
        }

        function toggleFarming() {

            const statusText = document.getElementById('farmingStatusText');

            if (farmingActive) {
                farmingActive = false;
                if (farmingLoopTimeout) {
                    clearTimeout(farmingLoopTimeout);
                    farmingLoopTimeout = null;

                btn.innerHTML = '<i class="bi bi-play-fill me-1"></i>ابدأ التجميع';
                btn.className = 'btn btn-success-glow btn-glow';
                indicator.className = 'farming-indicator inactive';
                statusText.textContent = 'متوقف';
                addLog('⏹️ تم إيقاف التجميع', 'info');
                showToast('تم إيقاف التجميع', 'info');
            } else {
                farmingActive = true;
                btn.innerHTML = '<i class="bi bi-stop-fill me-1"></i>إيقاف التجميع';
                btn.className = 'btn btn-danger-glow btn-glow';
                indicator.className = 'farming-indicator active';
                statusText.textContent = 'يعمل ...';
                addLog('▶️ بدأ التجميع', 'info');
                showToast('بدأ التجميع', 'success');
                farmingLoop();
            }
        }

        // =================================================================

        function showToast(message, type = 'info') {
            const toast = document.getElementById('liveToast');
            const title = document.getElementById('toastTitle');
            const body = document.getElementById('toastBody');
            const colors = {
                success: 'text-success',
                danger: 'text-danger',
                warning: 'text-warning',
                info: 'text-info'
            };
            title.className = `me-auto ${colors[type] || 'text-light'}`;
            title.textContent = type.charAt(0).toUpperCase() + type.slice(1);

        // تسجيل الدخول
        async function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            if (!user || !pass) {
                document.getElementById('loginStatus').textContent = '⚠️ يرجى ملء جميع الحقول';
                return;
            }
            const statusDiv = document.getElementById('loginStatus');
            statusDiv.innerHTML = '⏳ جاري تسجيل الدخول ... <span class="loader"></span>';
            document.getElementById('loginBtn').disabled = true;

            const result = await login(user, pass);
            if (result.success) {
                const attested = await attestDevice();

                showToast(`مرحباً ${result.user.username || user}`, 'success');
                addLog(`👋 تم تسجيل الدخول باسم ${result.user.username || user}`, 'info');
                stats = { total: 0, good: 0, bad: 0, score: 0 };
                updateStatsUI();
            } else {
                statusDiv.textContent = `❌ ${result.error}`;
                showToast(result.error, 'danger');
                addLog(`❌ فشل تسجيل الدخول: ${result.error}`, 'bad');

            document.getElementById('loginBtn').disabled = false;
        }

        function showDashboard(user) {

            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            currentUserScore = user.score || 0;

        function selectAmount(amount) {
            selectedAmount = amount;

            document.querySelectorAll('.amount-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.amount) === amount) {

        function openOrderModal(type, labelText) {
            currentOrderType = type;
            const modal = document.getElementById('orderModal');
            const label = document.getElementById('orderTargetLabel');
            const targetInput = document.getElementById('orderTarget');
            const amountInput = document.getElementById('orderAmount');
            const statusDiv = document.getElementById('orderStatus');

                followers: 'متابعين',
                likes: 'لايكات',
                views: 'مشاهدات',

            };
            document.getElementById('orderModalLabel').textContent = `إرسال طلب ${typeNames[type] || type}`;
            label.textContent = labelText || 'الهدف';
            targetInput.value = '';
            amountInput.value = selectedAmount;
            statusDiv.textContent = '';
            document.querySelectorAll('.amount-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.amount) === selectedAmount) {
                    btn.classList.add('active');
                }

            if (!orderModalInstance) {
                orderModalInstance = new bootstrap.Modal(modal);
            }
            orderModalInstance.show();

        async function submitOrder() {
            const target = document.getElementById('orderTarget').value.trim();
            const amountInput = document.getElementById('orderAmount');
            const amount = parseInt(amountInput.value.trim());
            const statusDiv = document.getElementById('orderStatus');

            if (!target) {
                statusDiv.textContent = '⚠️ يرجى إدخال الهدف';
                return;
            }
            if (isNaN(amount) || amount < 1) {
                statusDiv.textContent = '⚠️ أدخل كمية صحيحة';
                return;
            }

            statusDiv.textContent = '⏳ جاري الإرسال ...';
            document.getElementById('orderSubmitBtn').disabled = true;

            const result = await createOrder(currentOrderType, amount, target);
            if (result.success) {
                statusDiv.innerHTML = `✅ تم إرسال طلب ${currentOrderType} بنجاح! الكمية: ${amount}`;
                showToast(`تم إرسال ${amount} ${currentOrderType}`, 'success');
                addLog(`📤 تم إرسال طلب ${currentOrderType} (${amount})`, 'good');
                setTimeout(() => {
                    if (orderModalInstance) orderModalInstance.hide();
                }, 1500);
            } else {
                statusDiv.textContent = `❌ ${result.error}`;
                showToast(result.error, 'danger');
                addLog(`❌ فشل إرسال طلب ${currentOrderType}: ${result.error}`, 'bad');
            }
            document.getElementById('orderSubmitBtn').disabled = false;
        }
