<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - مشرف</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: rtl;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 0, 150, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(0, 200, 255, 0.1) 0%, transparent 50%);
            animation: rotateBg 20s linear infinite;
            z-index: 0;
        }
        @keyframes rotateBg {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 30px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ===== شاشة تسجيل الدخول ===== */
        #loginScreen {
            animation: fadeSlide 0.5s ease;
        }
        #loginScreen h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 10px;
        }
        #loginScreen h1 span {
            background: linear-gradient(90deg, #ff0050, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loginScreen p {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 25px;
        }
        .login-form input {
            width: 100%;
            padding: 14px 20px;
            margin: 8px 0;
            border-radius: 60px;
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 16px;
            outline: 2px solid transparent;
            transition: 0.3s;
        }
        .login-form input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .login-form input:focus {
            outline-color: #ff0050;
            background: rgba(255, 255, 255, 0.12);
        }
        .login-form button {
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #ff0050, #ff2d75);
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(255, 0, 80, 0.3);
            margin-top: 12px;
        }
        .login-form button:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.5);
        }
        .login-error {
            color: #e17055;
            font-size: 14px;
            margin-top: 10px;
        }

        /* ===== الواجهة الرئيسية ===== */
        #mainApp {
            animation: fadeSlide 0.5s ease;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #fff;
            font-size: 24px;
        }
        .header h1 span {
            background: linear-gradient(90deg, #ff0050, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .logout-btn {
            background: rgba(255, 0, 0, 0.2);
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .header .logout-btn:hover {
            background: rgba(255, 0, 0, 0.4);
        }

        /* الإحصائيات */
        .stats-box {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stats-box .stat-item {
            color: #ddd;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-box .stat-item strong {
            color: #fff;
            font-size: 18px;
        }

        /* نموذج الإدخال */
        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .input-group input {
            flex: 1;
            min-width: 180px;
            padding: 14px 22px;
            border-radius: 60px;
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 15px;
            outline: 2px solid transparent;
            transition: 0.3s;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .input-group input:focus {
            outline-color: #ff0050;
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-primary {
            padding: 14px 32px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #ff0050, #ff2d75);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(255, 0, 80, 0.3);
            white-space: nowrap;
        }
        .btn-primary:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.5);
        }

        /* ===== شريط التقدم داخل الفيديو ===== */
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin: 12px 0;
        }
        .video-wrapper video {
            width: 100%;
            max-height: 500px;
            display: block;
            background: #000;
        }
        .video-progress-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .video-progress-overlay.active {
            opacity: 1;
        }
        .video-progress-overlay .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0050, #00d4ff);
            border-radius: 0 0 16px 16px;
            transition: width 0.3s ease;
        }
        .video-progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 60px;
            display: none;
            z-index: 5;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-progress-text.active {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        /* بطاقة النتيجة */
        .result-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            padding: 22px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            animation: fadeSlide 0.6s ease;
        }
        .result-card.active {
            display: block;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .avatar-frame {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ff0050, #00d4ff);
            box-shadow: 0 0 30px rgba(255, 0, 80, 0.2);
            flex-shrink: 0;
        }
        .avatar-frame img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
            border: 2px solid #1a1a2e;
        }
        .user-info h3 {
            color: #fff;
            font-size: 19px;
        }
        .user-info .region {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 12px 0;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px;
            border-radius: 40px;
            color: #bbb;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .stat-item strong {
            color: #fff;
        }
        .video-title {
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            margin: 10px 0 14px;
            opacity: 0.9;
        }

        .download-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 14px 0 10px;
        }
        .btn-secondary {
            flex: 1;
            min-width: 120px;
            text-align: center;
            padding: 12px 10px;
            border-radius: 60px;
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        .btn-success {
            background: linear-gradient(135deg, #00b894, #00cec9) !important;
            box-shadow: 0 4px 20px rgba(0, 206, 201, 0.2);
        }
        .btn-purple {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe) !important;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.2);
        }
        .btn-copy {
            background: linear-gradient(135deg, #fdcb6e, #f39c12) !important;
            color: #2d3436 !important;
        }
        audio {
            width: 100%;
            border-radius: 16px;
            margin-top: 8px;
            background: #1a1a2e;
        }

        /* المطور */
        .developer-info {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
        .developer-info a {
            color: #00d4ff;
            text-decoration: none;
        }
        .developer-info a:hover {
            text-decoration: underline;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* إشعارات (Toast) */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 500px;
        }
        .toast {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 14px 22px;
            border-radius: 60px;
            border-right: 4px solid #ff0050;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            font-size: 15px;
            font-weight: 500;
            pointer-events: auto;
            animation: slideDown 0.4s ease forwards;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.success {
            border-right-color: #00b894;
        }
        .toast.error {
            border-right-color: #e17055;
        }
        .toast.info {
            border-right-color: #00d4ff;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .toast-out {
            animation: slideUp 0.3s ease forwards;
        }
        @keyframes slideUp {
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }
        }
    </style>
</head>
<body>

    <!-- حاوية الإشعارات -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">

        <!-- ===== شاشة تسجيل الدخول ===== -->
        <div id="loginScreen">
            <div class="text-center">
                <h1>Tik <span>Downloader</span></h1>
                <p>🔐 سجل دخولك للوصول إلى لوحة التحميل</p>
            </div>
            <form class="login-form" id="loginForm">
                <input type="text" id="usernameInput" placeholder="اسم المستخدم" required>
                <input type="password" id="passwordInput" placeholder="كلمة المرور" required>
                <button type="submit">🚀 دخول</button>
                <div id="loginError" class="login-error hidden"></div>
            </form>
        </div>

        <!-- ===== الواجهة الرئيسية (بعد الدخول) ===== -->
        <div id="mainApp" class="hidden">
            <div class="header">
                <h1>🎥 <span>تحميل تيك توك</span></h1>
                <button class="logout-btn" id="logoutBtn">🚪 خروج</button>
            </div>

            <!-- إحصائيات -->
            <div class="stats-box">
                <div class="stat-item">👥 المستخدمون النشطون: <strong id="userCount">0</strong></div>
                <div class="stat-item">📥 إجمالي التحميلات: <strong id="totalDownloads">0</strong></div>
            </div>

            <!-- نموذج الرابط -->
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="ألصق رابط تيك توك هنا ..." dir="ltr">
                <button class="btn-primary" id="downloadBtn">🔍 تحميل</button>
            </div>

            <!-- بطاقة النتائج -->
            <div class="result-card" id="resultCard">
                <div class="user-profile">
                    <div class="avatar-frame"><img id="avatarImg" src="" alt="Avatar"></div>
                    <div class="user-info">
                        <h3 id="authorName">---</h3>
                        <div class="region" id="regionInfo">📍 غير معروف</div>
                    </div>
                </div>
                <div class="stats-grid">
                    <span class="stat-item">👁️ <strong id="viewsCount">0</strong></span>
                    <span class="stat-item">💬 <strong id="commentsCount">0</strong></span>
                    <span class="stat-item">🔁 <strong id="sharesCount">0</strong></span>
                    <span class="stat-item">⏱️ <strong id="durationSec">0</strong> ث</span>
                </div>
                <div class="video-title" id="videoTitle">عنوان الفيديو</div>

                <!-- حاوية الفيديو مع شريط التقدم فوقه -->
                <div class="video-wrapper" id="videoWrapper">
                    <video id="videoPlayer" controls preload="metadata"></video>
                    <div class="video-progress-overlay" id="videoProgressOverlay">
                        <div class="fill" id="videoProgressFill"></div>
                    </div>
                    <div class="video-progress-text" id="videoProgressText">0%</div>
                </div>

                <!-- أزرار التحميل والنسخ -->
                <div class="download-actions" id="downloadActions"></div>

                <audio id="audioPlayer" controls style="margin-top:10px;"></audio>
            </div>

            <!-- معلومات المطور -->
            <div class="developer-info">
                <span>👨‍💻 المطور: <strong style="color:#fff;">rp01</strong> | <a href="https://t.me/lIIHII" target="_blank">تواصل عبر تليجرام</a></span>
                <button class="btn-secondary" style="display:inline;padding:4px 14px;min-width:auto;" id="copyLinkBtn">📋 نسخ الرابط</button>
            </div>
        </div>

    </div>

    <script>
        // ================================================================
        //  بيانات الاعتماد الثابتة (المشرف الوحيد)
        // ================================================================
        const VALID_USERNAME = 'rp01';
        const VALID_PASSWORD = '200786';

        // ================================================================
        //  البيانات المخزنة (إحصائيات)
        // ================================================================
        function loadStats() {
            try {
                const data = JSON.parse(localStorage.getItem('tiktok_stats'));
                if (data) return data;
            } catch (e) {}
            return { users: 0, downloads: 0 };
        }

        function saveStats(stats) {
            localStorage.setItem('tiktok_stats', JSON.stringify(stats));
        }

        let stats = loadStats();

        // ================================================================
        //  نظام الإشعارات (Toast)
        // ================================================================
        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: '✅',
                error: '❌',
                info: 'ℹ️'
            };
            toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-out');
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // ================================================================
        //  إدارة الجلسة (login/logout)
        // ================================================================
        function isLoggedIn() {
            return localStorage.getItem('tiktok_session') === 'true';
        }

        function setSession(status) {
            localStorage.setItem('tiktok_session', status ? 'true' : 'false');
        }

        function showMainApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            updateUI();
        }

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginError').classList.add('hidden');
        }

        // ================================================================
        //  تحديث الواجهة (إحصائيات)
        // ================================================================
        function updateUI() {
            document.getElementById('userCount').textContent = stats.users || 0;
            document.getElementById('totalDownloads').textContent = stats.downloads || 0;
        }

        // ================================================================
        //  معالجة تسجيل الدخول
        // ================================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorEl = document.getElementById('loginError');

            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                if (!localStorage.getItem('tiktok_user_counted')) {
                    stats.users = (stats.users || 0) + 1;
                    saveStats(stats);
                    localStorage.setItem('tiktok_user_counted', 'true');
                }
                setSession(true);
                showMainApp();
                showToast('تم تسجيل الدخول بنجاح', 'success');
            } else {
                errorEl.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة';
                errorEl.classList.remove('hidden');
                showToast('بيانات الدخول غير صحيحة', 'error');
            }
        });

        // ================================================================
        //  تسجيل الخروج
        // ================================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            setSession(false);
            localStorage.removeItem('tiktok_user_counted');
            showLoginScreen();
            showToast('تم تسجيل الخروج', 'info');
        });

        // ================================================================
        //  التحقق من الجلسة عند تحميل الصفحة
        // ================================================================
        if (isLoggedIn()) {
            showMainApp();
        } else {
            showLoginScreen();
        }

        // ================================================================
        //  وظيفة تحميل الملف مع شريط تقدم فوق الفيديو
        // ================================================================
        async function downloadFileWithProgress(url, filename, onProgress) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('فشل جلب الملف');
            const contentLength = response.headers.get('content-length');
            const total = parseInt(contentLength, 10);
            const reader = response.body.getReader();
            const chunks = [];
            let loaded = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                if (total) {
                    const percent = Math.round((loaded / total) * 100);
                    onProgress(percent, loaded, total);
                } else {
                    onProgress(null, loaded, null);
                }
            }

            const blob = new Blob(chunks);
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 10000);
            return blob;
        }

        // ================================================================
        //  معالجة تحميل الفيديو
        // ================================================================
        document.getElementById('downloadBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                showToast('ألصق رابط الفيديو أولاً', 'error');
                return;
            }

            const resultCard = document.getElementById('resultCard');
            resultCard.classList.remove('active');

            // إخفاء أي شريط تقدم سابق
            const progressOverlay = document.getElementById('videoProgressOverlay');
            const progressFill = document.getElementById('videoProgressFill');
            const progressText = document.getElementById('videoProgressText');
            progressOverlay.classList.remove('active');
            progressText.classList.remove('active');

            try {
                // 1. جلب معلومات الفيديو من API
                const apiUrl = `https://tikwm.com/api/?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('فشل الاتصال بخادم التحميل');
                const data = await response.json();
                if (!data || !data.data) throw new Error('الرابط غير صالح');

                const d = data.data;
                const images = d.images;
                const videoUrl = d.play || '';
                const musicUrl = d.music || '';
                const isImage = images && images.length > 0;

                // تعبئة البيانات العامة
                document.getElementById('avatarImg').src = d.author?.avatar || '';
                document.getElementById('authorName').textContent = d.author?.unique_id || 'غير معروف';
                document.getElementById('regionInfo').textContent = '📍 ' + (d.region || 'غير معروف');
                document.getElementById('viewsCount').textContent = d.play_count || 0;
                document.getElementById('commentsCount').textContent = d.comment_count || 0;
                document.getElementById('sharesCount').textContent = d.share_count || 0;
                document.getElementById('durationSec').textContent = d.duration || 0;
                document.getElementById('videoTitle').textContent = d.title || 'بدون عنوان';

                // عرض الوسائط
                const videoPlayer = document.getElementById('videoPlayer');
                const audioPlayer = document.getElementById('audioPlayer');
                const videoWrapper = document.getElementById('videoWrapper');

                if (isImage) {
                    // في حالة الصورة: نعرض الصورة في حاوية الفيديو (كصورة)
                    videoWrapper.innerHTML = `<img src="${images[0]}" alt="صورة تيك توك" style="width:100%;max-height:500px;object-fit:contain;background:#000;">`;
                    // إخفاء شريط التقدم لأنه لن يكون هناك تحميل فيديو
                    progressOverlay.classList.remove('active');
                    progressText.classList.remove('active');
                } else if (videoUrl) {
                    // في حالة فيديو: نضبط مصدر الفيديو ونعرض شريط التقدم
                    videoPlayer.src = videoUrl;
                    videoPlayer.load();
                    // نعيد تعيين حاوية الفيديو (إذا كانت تحتوي على صورة من قبل)
                    // لكننا نضمن أن الفيديو موجود
                    videoWrapper.innerHTML = '';
                    videoWrapper.appendChild(videoPlayer);
                    // نضيف شريط التقدم فوق الفيديو
                    const overlay = document.createElement('div');
                    overlay.className = 'video-progress-overlay';
                    overlay.id = 'videoProgressOverlay';
                    overlay.innerHTML = `<div class="fill" id="videoProgressFill"></div>`;
                    videoWrapper.appendChild(overlay);
                    // نضيف النص
                    const text = document.createElement('div');
                    text.className = 'video-progress-text';
                    text.id = 'videoProgressText';
                    text.textContent = '0%';
                    videoWrapper.appendChild(text);
                    // نعيد ربط المتغيرات
                    // ولكن بما أننا نعيد إنشاء العناصر، سنعيد تعريفها
                    // لكننا سنستخدم الطريقة القديمة مع إعادة تعيين
                    // بدلاً من ذلك، سنستخدم العناصر الموجودة ونضبطها
                } else {
                    videoWrapper.innerHTML = '<div style="color:#888;padding:20px;">لا يوجد محتوى مرئي</div>';
                }

                // أزرار التحميل
                const actionsDiv = document.getElementById('downloadActions');
                actionsDiv.innerHTML = '';

                // دالة مساعدة لتحميل الملف مع شريط تقدم (فوق الفيديو)
                const downloadWithProgress = async (fileUrl, filename, typeLabel) => {
                    // إظهار شريط التقدم
                    const overlay = document.getElementById('videoProgressOverlay');
                    const fill = document.getElementById('videoProgressFill');
                    const text = document.getElementById('videoProgressText');
                    if (overlay) {
                        overlay.classList.add('active');
                        fill.style.width = '0%';
                    }
                    if (text) {
                        text.classList.add('active');
                        text.textContent = '0%';
                    }

                    try {
                        await downloadFileWithProgress(fileUrl, filename, (percent, loaded, total) => {
                            if (percent !== null) {
                                if (fill) fill.style.width = percent + '%';
                                if (text) text.textContent = percent + '%';
                            } else {
                                // إذا لم يكن هناك total، نعرض الحجم المحمل
                                const loadedMB = (loaded / (1024 * 1024)).toFixed(1);
                                if (fill) fill.style.width = '100%';
                                if (text) text.textContent = `${loadedMB} MB`;
                            }
                        });
                        // زيادة عداد التحميلات
                        stats.downloads = (stats.downloads || 0) + 1;
                        saveStats(stats);
                        updateUI();
                        showToast(`تم تحميل ${filename} بنجاح`, 'success');
                    } catch (err) {
                        showToast('فشل التحميل، سيتم فتح الرابط في تبويب جديد.', 'error');
                        window.open(fileUrl, '_blank');
                    } finally {
                        // إخفاء شريط التقدم
                        if (overlay) overlay.classList.remove('active');
                        if (text) text.classList.remove('active');
                    }
                };

                if (isImage) {
                    const btnImg = document.createElement('button');
                    btnImg.className = 'btn-secondary btn-success';
                    btnImg.innerHTML = '🖼️ تحميل الصورة';
                    btnImg.onclick = () => downloadWithProgress(images[0], `tiktok_image_${d.author?.unique_id || 'img'}.jpg`,
                        'الصورة');
                    actionsDiv.appendChild(btnImg);
                } else if (videoUrl) {
                    const btnVid = document.createElement('button');
                    btnVid.className = 'btn-secondary btn-success';
                    btnVid.innerHTML = '📥 تحميل الفيديو HD';
                    btnVid.onclick = () => downloadWithProgress(videoUrl, `tiktok_${d.author?.unique_id || 'video'}.mp4`,
                        'الفيديو');
                    actionsDiv.appendChild(btnVid);
                }

                if (musicUrl) {
                    const btnAudio = document.createElement('button');
                    btnAudio.className = 'btn-secondary btn-purple';
                    btnAudio.innerHTML = '🎵 تحميل الصوت';
                    btnAudio.onclick = () => downloadWithProgress(musicUrl, `tiktok_audio_${d.author?.unique_id || 'song'}.mp3`,
                        'الصوت');
                    actionsDiv.appendChild(btnAudio);
                }

                // زر نسخ الرابط (مفتوح)
                const btnCopy = document.createElement('button');
                btnCopy.className = 'btn-secondary btn-copy';
                btnCopy.innerHTML = '📋 نسخ الرابط';
                btnCopy.onclick = () => {
                    const linkToCopy = isImage ? images[0] : videoUrl;
                    if (linkToCopy) {
                        navigator.clipboard.writeText(linkToCopy).then(() => {
                            showToast('تم نسخ الرابط إلى الحافظة', 'success');
                        }).catch(() => {
                            const textarea = document.createElement('textarea');
                            textarea.value = linkToCopy;
                            document.body.appendChild(textarea);
                            textarea.select();
                            document.execCommand('copy');
                            document.body.removeChild(textarea);
                            showToast('تم نسخ الرابط إلى الحافظة', 'success');
                        });
                    } else {
                        showToast('لا يوجد رابط للنسخ', 'error');
                    }
                };
                actionsDiv.appendChild(btnCopy);

                // رابط مفتوح (فتح في تبويب جديد)
                const btnOpen = document.createElement('button');
                btnOpen.className = 'btn-secondary';
                btnOpen.innerHTML = '🔗 فتح الرابط';
                btnOpen.onclick = () => {
                    const link = isImage ? images[0] : videoUrl;
                    if (link) window.open(link, '_blank');
                    else showToast('لا يوجد رابط', 'error');
                };
                actionsDiv.appendChild(btnOpen);

                // مشغل الصوت
                audioPlayer.src = musicUrl || '';
                audioPlayer.load();

                // عرض النتيجة
                resultCard.classList.add('active');
                showToast('تم جلب المحتوى بنجاح', 'success');

            } catch (error) {
                showToast('❌ خطأ: ' + error.message, 'error');
            }
        });

        // ================================================================
        //  زر نسخ الرابط العام (في الأسفل)
        // ================================================================
        document.getElementById('copyLinkBtn').addEventListener('click', function() {
            const urlInput = document.getElementById('urlInput');
            if (urlInput.value.trim()) {
                navigator.clipboard.writeText(urlInput.value.trim()).then(() => {
                    showToast('تم نسخ الرابط إلى الحافظة', 'success');
                }).catch(() => {
                    urlInput.select();
                    document.execCommand('copy');
                    showToast('تم نسخ الرابط إلى الحافظة', 'success');
                });
            } else {
                showToast('لا يوجد رابط لنسخه', 'error');
            }
        });

        // ================================================================
        //  دعم Enter في حقل الرابط
        // ================================================================
        document.getElementById('urlInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('downloadBtn').click();
        });

        // ================================================================
        //  تحديث الإحصائيات الأولية
        // ================================================================
        updateUI();
    </script>

</body>
</html>
